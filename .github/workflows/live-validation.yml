name: Weekly live validation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-weekly-live-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Two-account MCP validation on AWS
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: linkedin-live
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_LIVE_RUNNER_REGION }}
      AWS_INSTANCE_ID: ${{ vars.AWS_LIVE_RUNNER_INSTANCE_ID }}
      LINKEDIN_LIVE_ACCOUNT_A_SLUG: ${{ vars.LINKEDIN_LIVE_ACCOUNT_A_SLUG }}
      LINKEDIN_LIVE_ACCOUNT_B_SLUG: ${{ vars.LINKEDIN_LIVE_ACCOUNT_B_SLUG }}
      LINKEDIN_LIVE_ACCOUNT_A_PROFILE_PATH: ${{ vars.LINKEDIN_LIVE_ACCOUNT_A_PROFILE_PATH }}
      LINKEDIN_LIVE_ACCOUNT_B_PROFILE_PATH: ${{ vars.LINKEDIN_LIVE_ACCOUNT_B_PROFILE_PATH }}
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_LIVE_RUNNER_ROLE_ARN }}
          role-session-name: linkedin-live-${{ github.run_id }}
          role-duration-seconds: 10800
          allowed-account-ids: ${{ vars.AWS_LIVE_RUNNER_ACCOUNT_ID }}

      - name: Validate orchestration configuration
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$AWS_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LINKEDIN_LIVE_ACCOUNT_A_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]
          [[ "$LINKEDIN_LIVE_ACCOUNT_B_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]
          [[ "$LINKEDIN_LIVE_ACCOUNT_A_PROFILE_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$LINKEDIN_LIVE_ACCOUNT_B_PROFILE_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]

      - name: Start the dedicated EC2 worker
        run: |
          set -euo pipefail
          aws ec2 start-instances --instance-ids "$AWS_INSTANCE_ID" >/dev/null
          aws ec2 wait instance-running --instance-ids "$AWS_INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$AWS_INSTANCE_ID"

      - name: Wait for Systems Manager
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            status="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$AWS_INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)"
            if [[ "$status" == "Online" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "The EC2 worker did not become available through Systems Manager." >&2
          exit 1

      - name: Run the exact main revision on EC2
        id: remote
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          parameters="$RUNNER_TEMP/linkedin-live-ssm-command.json"
          remote_command="$(cat <<EOF
          set -eu
          for _ in \$(seq 1 120); do
            if [ -f /var/lib/linkedin-live-bootstrap-complete ]; then
              break
            fi
            sleep 5
          done
          test -f /var/lib/linkedin-live-bootstrap-complete
          repository_dir=/var/lib/linkedin-mcp-live/work/repository
          if [ ! -d "\$repository_dir/.git" ]; then
            runuser -u linkedin-live -- git clone --no-checkout \
              https://github.com/$REPOSITORY.git "\$repository_dir" >/dev/null 2>&1
          fi
          runuser -u linkedin-live -- git -C "\$repository_dir" remote set-url origin \
            https://github.com/$REPOSITORY.git
          runuser -u linkedin-live -- git -C "\$repository_dir" fetch --depth=1 origin $REVISION \
            >/dev/null 2>&1
          runuser -u linkedin-live -- git -C "\$repository_dir" checkout --detach --force FETCH_HEAD \
            >/dev/null 2>&1
          runuser -u linkedin-live -- env \
            LINKEDIN_LIVE_ACCOUNT_A_SLUG=$LINKEDIN_LIVE_ACCOUNT_A_SLUG \
            LINKEDIN_LIVE_ACCOUNT_B_SLUG=$LINKEDIN_LIVE_ACCOUNT_B_SLUG \
            LINKEDIN_LIVE_ACCOUNT_A_PROFILE_PATH=$LINKEDIN_LIVE_ACCOUNT_A_PROFILE_PATH \
            LINKEDIN_LIVE_ACCOUNT_B_PROFILE_PATH=$LINKEDIN_LIVE_ACCOUNT_B_PROFILE_PATH \
            "\$repository_dir/infra/aws-live-validation/run-live-validation.sh"
          EOF
          )"
          jq -n --arg command "$remote_command" \
            '{commands: [$command], executionTimeout: ["7200"]}' >"$parameters"
          command_id="$(aws ssm send-command \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "LinkedIn MCP weekly live validation $GITHUB_RUN_ID" \
            --timeout-seconds 7500 \
            --parameters "file://$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >>"$GITHUB_OUTPUT"

          terminal_status=""
          for _ in $(seq 1 750); do
            terminal_status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$AWS_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$terminal_status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 10
          done
          case "$terminal_status" in
            Success|Failed|Cancelled|TimedOut|Cancelling) ;;
            *) terminal_status="TimedOut" ;;
          esac
          echo "remote_status=$terminal_status" >>"$GITHUB_OUTPUT"

          invocation="$RUNNER_TEMP/linkedin-live-command-result.json"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID" >"$invocation"
          jq -r '.StandardOutputContent' "$invocation" \
            >"$RUNNER_TEMP/linkedin-live-command-output.txt"

      - name: Extract sanitized validation results
        id: results
        if: ${{ always() && steps.remote.outputs.command_id != '' }}
        env:
          REMOTE_STATUS: ${{ steps.remote.outputs.remote_status }}
        run: |
          set -euo pipefail
          command_output="$RUNNER_TEMP/linkedin-live-command-output.txt"
          encoded_archive="$RUNNER_TEMP/linkedin-live-results.tar.gz.b64"
          sed -n '/^LINKEDIN_LIVE_ARCHIVE_BEGIN$/,/^LINKEDIN_LIVE_ARCHIVE_END$/p' \
            "$command_output" | sed '1d;$d' >"$encoded_archive"
          test -s "$encoded_archive"
          mkdir -p "$RUNNER_TEMP/linkedin-live-artifact"
          base64 --decode "$encoded_archive" \
            | tar -xz -C "$RUNNER_TEMP/linkedin-live-artifact"
          test -f "$RUNNER_TEMP/linkedin-live-artifact/report.json"
          test -f "$RUNNER_TEMP/linkedin-live-artifact/linkedin-live-status/summary.json"
          test -d "$RUNNER_TEMP/linkedin-live-artifact/linkedin-live-status/badges"
          overall_status="$(jq -r '.overall_status' \
            "$RUNNER_TEMP/linkedin-live-artifact/report.json")"
          echo "overall_status=$overall_status" >>"$GITHUB_OUTPUT"
          echo "remote_status=$REMOTE_STATUS" >>"$GITHUB_OUTPUT"

      - name: Upload sanitized live results
        if: ${{ always() && steps.results.outputs.overall_status != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linkedin-live-status
          path: ${{ runner.temp }}/linkedin-live-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Stop the EC2 worker
        if: always()
        run: |
          set -euo pipefail
          state="$(aws ec2 describe-instances \
            --instance-ids "$AWS_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          if [[ "$state" != "stopped" && "$state" != "terminated" ]]; then
            aws ec2 stop-instances --instance-ids "$AWS_INSTANCE_ID" >/dev/null
            aws ec2 wait instance-stopped --instance-ids "$AWS_INSTANCE_ID"
          fi

      - name: Enforce live result
        if: always()
        env:
          OVERALL_STATUS: ${{ steps.results.outputs.overall_status }}
          REMOTE_STATUS: ${{ steps.results.outputs.remote_status }}
        run: |
          test "$REMOTE_STATUS" = "Success"
          test "$OVERALL_STATUS" = "passed"

  publish-status:
    name: Publish tool status badges
    needs: validate
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download sanitized status files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: linkedin-live-status
          path: .live-status-artifact

      - name: Publish generated status branch
        env:
          STATUS_BRANCH: live-status
        run: |
          set -euo pipefail
          STATUS_SOURCE=".live-status-artifact/linkedin-live-status"
          test -f "$STATUS_SOURCE/summary.json"
          test -d "$STATUS_SOURCE/badges"

          if git ls-remote --exit-code --heads origin "$STATUS_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$STATUS_BRANCH"
            git switch --force-create "$STATUS_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$STATUS_BRANCH"
            git rm --force --recursive --ignore-unmatch .
          fi

          rm -rf badges
          mkdir -p badges
          cp "$STATUS_SOURCE/summary.json" summary.json
          cp "$STATUS_SOURCE"/badges/*.json badges/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary.json badges
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update weekly live validation status"
          git push origin "HEAD:$STATUS_BRANCH"
