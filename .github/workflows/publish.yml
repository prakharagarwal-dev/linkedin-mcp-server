name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      target:
        description: Release surfaces to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  MCP_SERVER_NAME: io.github.prakharagarwal-dev/linkedin-mcp-server

jobs:
  build:
    name: Build and attest release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.12"

      - name: Verify release version
        run: |
          VERSION="$(uv version --short)"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(jq -r .version server.json)" = "$VERSION"
          test "$(jq -r .version packaging/mcpb/manifest.json)" = "$VERSION"

      - name: Build and check Python distributions
        run: |
          uv build
          uvx --from twine twine check dist/*.whl dist/*.tar.gz

      - name: Stage and validate MCPB bundle
        run: |
          mkdir -p .release/mcpb
          cp packaging/mcpb/manifest.json .release/mcpb/manifest.json
          cp pyproject.toml uv.lock README.md PRIVACY.md LICENSE .release/mcpb/
          git archive HEAD src | tar -x -C .release/mcpb
          cp assets/icon.png .release/mcpb/icon.png
          npx --yes @anthropic-ai/mcpb@2.1.2 validate .release/mcpb/manifest.json
          python - <<'PY'
          import os
          import subprocess
          import time
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path(".release/mcpb")
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          output = Path("dist") / f"linkedin-mcp-server-{version}.mcpb"
          epoch = int(
              subprocess.check_output(
                  ["git", "show", "-s", "--format=%ct", "HEAD"],
                  text=True,
              ).strip()
          )
          timestamp = time.gmtime(epoch)[:6]

          with ZipFile(output, "w") as bundle:
              for path in sorted(item for item in root.rglob("*") if item.is_file()):
                  info = ZipInfo(path.relative_to(root).as_posix(), date_time=timestamp)
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  bundle.writestr(
                      info,
                      path.read_bytes(),
                      compress_type=ZIP_DEFLATED,
                      compresslevel=9,
                  )
          PY
          npx --yes @anthropic-ai/mcpb@2.1.2 info \
            "dist/linkedin-mcp-server-${RELEASE_TAG#v}.mcpb"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload MCPB bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcpb-bundle
          path: dist/*.mcpb
          if-no-files-found: error

  github-release:
    name: Attach verified release artifacts
    if: ${{ github.event_name == 'release' || inputs.target == 'all' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: release-assets

      - name: Download MCPB bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb-bundle
          path: release-assets

      - name: Create checksums and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS
          gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" --clobber ./*

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/linkedin-mcp-local/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  container:
    name: Publish GHCR image
    if: ${{ github.event_name == 'release' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ steps.metadata.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest container image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
