<!doctype html>
<html>
  <body>
    <main>
      <h1>Messaging</h1>
      <button aria-label="Inbox category">Focused</button>
      <div role="menu" aria-label="Inbox categories">
        <button role="menuitem" aria-label="Focused">Focused</button>
        <button role="menuitem" aria-label="Other">Other</button>
        <button role="menuitem" aria-label="Archived">Archived</button>
        <button role="menuitem" aria-label="Spam">Spam</button>
      </div>
      <label>
        Search messages
        <input aria-label="Search messages" />
      </label>
      <button aria-label="Filter messages">Filter messages</button>
      <div role="menu" aria-label="Message filters">
        <button role="menuitem" aria-label="Jobs">Jobs</button>
        <button role="menuitem" aria-label="Unread messages">Unread</button>
        <button role="menuitem" aria-label="My Connections">My Connections</button>
        <button role="menuitem" aria-label="Starred">Starred</button>
        <button role="menuitem" aria-label="InMail">InMail</button>
      </div>
      <ul aria-label="Conversation list">
        <li class="msg-conversation-listitem msg-conversation-listitem--unread">
          <a href="/messaging/thread/thread-123/">Open conversation</a>
          <a href="/in/jane-doe/">Jane Doe</a>
          <p class="msg-conversation-card__message-snippet">See the attached brief.</p>
          <time>10:30 AM</time>
        </li>
      </ul>
      <section aria-label="Conversation with Jane Doe">
        <h2>Jane Doe</h2>
        <a href="/in/jane-doe/">Jane Doe</a>
        <ol id="messages">
          <li class="msg-s-event-listitem msg-s-event-listitem--incoming">
            <span class="msg-s-message-group__name">Jane Doe</span>
            <p class="msg-s-event-listitem__body">See the attached brief.</p>
            <a
              href="https://media.licdn.com/brief.pdf"
              data-test-message-attachment
              data-kind="document"
              data-file-name="brief.pdf"
            >brief.pdf</a>
          </li>
        </ol>
        <div
          id="composer"
          contenteditable="true"
          role="textbox"
          aria-label="Write a message"
          maxlength="8000"
        ></div>
        <input
          id="attachment-input"
          type="file"
          aria-label="Attach a file"
          accept=".bmp,.csv,.doc,.docx,.gif,.jpeg,.jpg,.mp4,.pdf,.png,.ppt,.pptx,.txt,.xls,.xlsx"
          hidden
        />
        <div id="pending-attachments"></div>
        <button id="gif-opener" aria-label="GIF">GIF</button>
        <section id="gif-picker" aria-label="GIF picker" hidden>
          <input aria-label="Search GIFs" />
          <button id="gif-result" aria-label="Dancing robot GIF">Dancing robot GIF</button>
        </section>
        <button id="send" aria-label="Send">Send</button>
      </section>
    </main>
    <script>
      const composer = document.querySelector("#composer");
      const input = document.querySelector("#attachment-input");
      const pending = document.querySelector("#pending-attachments");
      const messages = document.querySelector("#messages");
      let attached = [];

      input.addEventListener("change", () => {
        for (const file of input.files) {
          attached.push(file.name);
          const marker = document.createElement("span");
          marker.textContent = file.name;
          pending.appendChild(marker);
        }
      });

      document.querySelector("#send").addEventListener("click", () => {
        const item = document.createElement("li");
        item.className = "msg-s-event-listitem msg-s-event-listitem--outgoing";
        item.innerHTML = '<span class="msg-s-message-group__name">You</span>';
        if (composer.innerText) {
          const body = document.createElement("p");
          body.className = "msg-s-event-listitem__body";
          body.textContent = composer.innerText;
          item.appendChild(body);
        }
        for (const name of attached) {
          const attachment = document.createElement("span");
          const extension = name.split(".").pop().toLowerCase();
          attachment.dataset.testMessageAttachment = "";
          attachment.dataset.fileName = name;
          attachment.dataset.kind = extension === "mp4"
            ? "video"
            : ["bmp", "gif", "jpeg", "jpg", "png"].includes(extension)
              ? "image"
              : "document";
          attachment.textContent = name;
          item.appendChild(attachment);
        }
        messages.appendChild(item);
        composer.innerText = "";
        attached = [];
        pending.innerText = "";
        input.value = "";
      });

      document.querySelector("#gif-opener").addEventListener("click", () => {
        document.querySelector("#gif-picker").hidden = false;
      });
      document.querySelector("#gif-result").addEventListener("click", () => {
        const item = document.createElement("li");
        item.className = "msg-s-event-listitem msg-s-event-listitem--outgoing";
        item.innerHTML = '<span class="msg-s-message-group__name">You</span>';
        const gif = document.createElement("span");
        gif.dataset.testMessageAttachment = "";
        gif.dataset.kind = "gif";
        gif.setAttribute("aria-label", "Dancing robot GIF");
        gif.textContent = "Dancing robot GIF";
        item.appendChild(gif);
        messages.appendChild(item);
        document.querySelector("#gif-picker").hidden = true;
      });
    </script>
  </body>
</html>
