  </head>

      <div role="button" aria-expanded="false" tabindex="0">
        <input aria-hidden="true" type="checkbox" checked />
        Focused (2)
      </div>
      <div data-testid="lazy-column">
        <div><div><div data-display-contents="true">
          <div role="listitem">
            <a href="/in/only-rendered/"><strong>Only Rendered</strong></a>
            <button aria-label="Accept Only Rendered’s invitation">Accept</button>
          </div>
        </div></div></div>
      </div>
      <p>No more invitations</p>
    </main>
  </body>
</html>
