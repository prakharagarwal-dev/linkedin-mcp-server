<!doctype html>
<html>
  <body>
    <main>
      <h1>Messaging</h1>
      <ul aria-label="Conversation list">
        <li class="msg-conversation-listitem" tabindex="0" id="jane-card">
          <h3 class="msg-conversation-listitem__participant-names t-bold">Jane Doe</h3>
          <p class="msg-conversation-listitem__message-snippet">
            Can we discuss the role?
          </p>
          <time>10:30 AM</time>
        </li>
        <li class="msg-conversation-listitem" tabindex="0">
          <h3 class="msg-conversation-listitem__participant-names t-normal">Alex Lee</h3>
          <p class="msg-conversation-listitem__message-snippet">You: Sounds good.</p>
          <time>Yesterday</time>
        </li>
      </ul>
      <section id="thread" aria-label="Conversation with Jane Doe" hidden>
        <h2>Jane Doe</h2>
        <a href="/in/jane-doe/">Jane Doe</a>
        <ol>
          <li class="msg-s-event-listitem msg-s-event-listitem--incoming">
            <span class="msg-s-message-group__name">Jane Doe</span>
            <time>10:29 AM</time>
            <p class="msg-s-event-listitem__body">Can we discuss the role?</p>
          </li>
          <li class="msg-s-event-listitem msg-s-event-listitem--outgoing">
            <span class="msg-s-message-group__name">You</span>
            <time>10:30 AM</time>
            <p class="msg-s-event-listitem__body">Absolutely.</p>
          </li>
        </ol>
        <div contenteditable="true" role="textbox" aria-label="Write a message"></div>
        <button aria-label="Send">Send</button>
      </section>
    </main>
    <script>
      document.querySelector("#jane-card").addEventListener("click", () => {
        document.querySelector("#thread").hidden = false;
        history.pushState({}, "", "/messaging/thread/thread-current/");
      });
    </script>
  </body>
</html>
