<!doctype html>
<html>
  <body>
    <main>
      <h1>Messaging</h1>
      <section aria-label="Conversation with Jane Doe">
        <h2>Jane Doe</h2>
        <a href="/in/jane-doe/">Jane Doe</a>
        <ol id="messages">
          <li class="msg-s-event-listitem msg-s-event-listitem--incoming">
            <span class="msg-s-message-group__name">Jane Doe</span>
            <p class="msg-s-event-listitem__body">Hello!</p>
          </li>
        </ol>
        <div
          id="composer"
          contenteditable="true"
          role="textbox"
          aria-label="Write a message"
          maxlength="8000"
        ></div>
        <input id="image-upload" type="file" accept="image/*" />
        <button id="send" aria-label="Send">Send</button>
      </section>
    </main>
    <script>
      let pendingImage = null;
      document.querySelector("#image-upload").addEventListener("change", event => {
        pendingImage = event.target.files[0]?.name || null;
      });
      document.querySelector("#send").addEventListener("click", () => {
        const composer = document.querySelector("#composer");
        const day = document.createElement("li");
        day.className = "msg-s-message-list__day";
        day.innerHTML = `
          <span>TODAY</span>
          <ol>
            <li class="msg-s-message-list__event">
              <div class="msg-s-event-listitem align-self-flex-end">
                <span class="msg-s-message-group__name">You</span>
                <div class="msg-s-event-listitem__message-bubble">
                  <p class="msg-s-event-listitem__body"></p>
                  <div
                    class="msg-s-event-listitem__attachment"
                    data-test-message-attachment
                  >
                    <a href="#">
                      Click or press enter to display in the image preview
                    </a>
                  </div>
                </div>
              </div>
            </li>
          </ol>
        `;
        day.querySelector("p").textContent = composer.innerText;
        document.querySelector("#messages").appendChild(day);
        composer.innerText = "";
        pendingImage = null;
      });
    </script>
  </body>
</html>
