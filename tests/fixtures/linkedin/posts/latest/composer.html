<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Feed Fixture</title>
    <style>
      [hidden] { display: none !important; }
      [role="dialog"] { border: 1px solid #888; padding: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Home</h1>
      <button type="button" aria-label="Start a post">Start a post</button>
      <section id="feed" aria-label="Feed"></section>
      <div id="toast" role="alert"></div>
    </main>

    <section role="dialog" aria-label="Loading" id="composer-loader" hidden>
      <h2>Loading</h2>
    </section>

    <section role="dialog" aria-label="Create a post" id="composer" hidden>
      <a href="/in/current-member/">Current Member</a>
      <button type="button" aria-label="Post settings: Anyone">Post settings</button>
      <div
        role="textbox"
        aria-label="What do you want to talk about?"
        contenteditable="true"
        maxlength="3000"
        id="post-text"
      ></div>
      <div id="link-preview" data-testid="link-preview" hidden>
        Example link preview
        <button type="button" aria-label="Remove preview">Remove preview</button>
      </div>
      <button type="button" aria-label="Add media">Add media</button>
      <button type="button" aria-label="Create an event">Create an event</button>
      <button type="button" aria-label="Celebrate an occasion">Celebrate an occasion</button>
      <button type="button" aria-label="Add collaborators">Add collaborators</button>
      <button type="button" aria-label="More">More</button>
      <button type="button" aria-label="Schedule post">Schedule post</button>
      <button type="button" aria-label="Post">Post</button>
    </section>

    <section id="more-options" role="menu" hidden>
      <button type="button" aria-label="Add a document">Add a document</button>
      <button type="button" aria-label="Create a poll">Create a poll</button>
      <button type="button" aria-label="Celebrate an occasion">Celebrate an occasion</button>
      <button type="button" aria-label="Share that you're hiring">Share that you're hiring</button>
      <button type="button" aria-label="Find an expert">Find an expert</button>
    </section>
    <section role="listbox" id="mention-suggestions" aria-label="Mention suggestions" hidden>
      <a href="/in/alex-ray/">Alex Ray</a>
      <a href="/company/acme-cloud/">Acme Cloud</a>
    </section>

    <section role="dialog" aria-label="Editor" id="media-editor" hidden>
      <h2>Select files to begin</h2>
      <p>Share images or a single video</p>
      <input
        type="file"
        aria-label="Upload media"
        multiple
        accept="image/gif,image/jpeg,image/jpg,image/png,image/webp,video/*,video/mp4"
      />
      <button type="button" aria-label="Select diagram.png" data-image-control hidden>
        Select diagram.png
      </button>
      <button type="button" aria-label="Edit" data-image-control hidden>Edit</button>
      <button type="button" aria-label="Tag" data-image-control hidden>Tag</button>
      <button type="button" aria-label="Alternative text" data-image-control hidden>
        Alternative text
      </button>
      <button type="button" aria-label="Play" data-video-control hidden>Play</button>
      <button type="button" aria-label="Captions" data-video-control hidden>Captions</button>
      <button type="button" aria-label="Video thumbnail" data-video-control hidden>
        Video thumbnail
      </button>
      <button type="button" aria-label="Next">Next</button>
    </section>
    <section role="dialog" aria-label="Alternative text" id="photo-details" hidden>
      <textarea
        placeholder="How would you describe this image?"
        maxlength="1000"
      ></textarea>
      <button type="button" aria-label="Add">Add</button>
    </section>
    <section role="dialog" aria-label="Tag people or organizations" id="tag-member" hidden>
      <input placeholder="Type a name or names" />
      <a href="/in/alex-ray/">Alex Ray</a>
      <a href="/company/acme-cloud/">Acme Cloud</a>
      <button type="button" aria-label="Add">Add</button>
    </section>

    <section role="dialog" aria-label="Edit image" id="image-editor" hidden>
      <button type="button" role="tab" aria-label="Crop">Crop</button>
      <button type="button" role="tab" aria-label="Filter">Filter</button>
      <button type="button" role="tab" aria-label="Adjust">Adjust</button>
      <label><input type="radio" name="aspect" aria-label="Original" checked />Original</label>
      <label><input type="radio" name="aspect" aria-label="Square" />Square</label>
      <label><input type="radio" name="aspect" aria-label="4:1" />4:1</label>
      <label><input type="radio" name="aspect" aria-label="3:4" />3:4</label>
      <label><input type="radio" name="aspect" aria-label="16:9" />16:9</label>
      <button type="button" aria-label="Rotate anticlockwise">Rotate anticlockwise</button>
      <button type="button" aria-label="Rotate clockwise">Rotate clockwise</button>
      <button type="button" aria-label="Flip x">Flip x</button>
      <button type="button" aria-label="Flip y">Flip y</button>
      <label id="image-editor-zoom-slider-label">Zoom</label>
      <input
        type="range"
        min="1"
        max="3"
        step=".1"
        value="1"
        aria-labelledby="image-editor-zoom-slider-label"
      />
      <label id="image-editor-straighten-slider-label">Straighten</label>
      <input
        type="range"
        min="-45"
        max="45"
        step="1"
        value="0"
        aria-labelledby="image-editor-straighten-slider-label"
      />
      <div id="filters">
        <label><input type="radio" name="filter" aria-label="Original" checked />Original</label>
        <label><input type="radio" name="filter" aria-label="Studio" />Studio</label>
        <label><input type="radio" name="filter" aria-label="Spotlight" />Spotlight</label>
        <label><input type="radio" name="filter" aria-label="Prime" />Prime</label>
        <label><input type="radio" name="filter" aria-label="Classic" />Classic</label>
        <label><input type="radio" name="filter" aria-label="Edge" />Edge</label>
        <label><input type="radio" name="filter" aria-label="Luminate" />Luminate</label>
      </div>
      <label id="brightness-slider-label">Brightness</label>
      <input type="range" min="-30" max="30" value="0" aria-labelledby="brightness-slider-label" />
      <label id="contrast-slider-label">Contrast</label>
      <input type="range" min="-30" max="30" value="0" aria-labelledby="contrast-slider-label" />
      <label id="saturation-slider-label">Saturation</label>
      <input type="range" min="-30" max="30" value="0" aria-labelledby="saturation-slider-label" />
      <label id="vignette-slider-label">Vignette</label>
      <input type="range" min="-30" max="30" value="0" aria-labelledby="vignette-slider-label" />
      <button type="button" aria-label="Apply">Apply</button>
    </section>
    <section role="dialog" aria-label="Video captions" id="video-captions" hidden>
      <label><input type="checkbox" aria-label="Add auto captions" checked /> Add auto captions</label>
      <label><input type="checkbox" aria-label="Review captions" /> Review captions</label>
      <input type="file" aria-label="Upload caption file" accept=".srt" />
      <button type="button" aria-label="Apply">Apply</button>
    </section>
    <section role="dialog" aria-label="Video thumbnail" id="video-thumbnail" hidden>
      <input
        type="file"
        aria-label="Add video thumbnail"
        accept="image/gif,image/jpeg,image/jpg,image/png,image/webp"
      />
      <button type="button" aria-label="Add">Add</button>
    </section>

    <section role="dialog" aria-label="Document editor" id="document-editor" hidden>
      <h2>Share a document</h2>
      <input type="file" aria-label="Upload document" accept=".pdf,.ppt,.pptx,.doc,.docx" />
      <label>
        Document title
        <input placeholder="Add a descriptive title to your document" maxlength="400" />
      </label>
      <button type="button" aria-label="Done">Done</button>
    </section>

    <section role="dialog" aria-label="Create a poll" id="poll-editor" hidden>
      <label>Question <textarea aria-label="Question" maxlength="140"></textarea></label>
      <label>Option 1 <input aria-label="Option 1" maxlength="30" /></label>
      <label>Option 2 <input aria-label="Option 2" maxlength="30" /></label>
      <label>Option 3 <input aria-label="Option 3" maxlength="30" /></label>
      <label>Option 4 <input aria-label="Option 4" maxlength="30" /></label>
      <button type="button" aria-label="Add option">Add option</button>
      <label>
        Poll duration
        <select aria-label="Poll duration">
          <option>1 day</option>
          <option>3 days</option>
          <option selected>1 week</option>
          <option>2 weeks</option>
        </select>
      </label>
      <button type="button" aria-label="Done">Done</button>
    </section>

    <section role="dialog" aria-label="Celebrate an occasion" id="celebration-chooser" hidden>
      <button type="button" aria-label="Project Launch">Project Launch</button>
      <button type="button" aria-label="Work Anniversary">Work Anniversary</button>
      <button type="button" aria-label="New Position">New Position</button>
      <button type="button" aria-label="New Educational Milestone">
        New Educational Milestone
      </button>
      <button type="button" aria-label="New Certification">New Certification</button>
    </section>
    <section role="dialog" aria-label="Celebration image editor" id="celebration-editor" hidden>
      <input
        type="file"
        aria-label="Upload custom celebration image"
        accept="image/gif,image/jpeg,image/jpg,image/png,image/webp"
      />
      <button type="button" aria-label="Alternative text">Alternative text</button>
      <div id="templates"></div>
      <button type="button" aria-label="Next">Next</button>
    </section>

    <section role="dialog" aria-label="Create event" id="event-editor" hidden>
      <input
        type="file"
        aria-label="Event cover image"
        accept="image/gif,image/jpeg,image/jpg,image/png,image/webp"
      />
      <button type="button" aria-label="Alternative text">Alternative text</button>
      <label><input type="radio" name="event-type" aria-label="Online" checked />Online</label>
      <label><input type="radio" name="event-type" aria-label="In person" />In person</label>
      <label>
        <input type="radio" name="event-format" aria-label="LinkedIn Live" />
        LinkedIn Live
      </label>
      <label>
        <input type="radio" name="event-format" aria-label="External event link" checked />
        External event link
      </label>
      <label>Event name <input aria-label="Event name" maxlength="75" /></label>
      <button type="button" aria-label="Time zone">Time zone</button>
      <label>Start date <input aria-label="Start date" /></label>
      <label>Start time <input aria-label="Start time" /></label>
      <label><input type="checkbox" aria-label="End date" />Add end date and time</label>
      <label>End date <input aria-label="End date" hidden /></label>
      <label>End time <input aria-label="End time" hidden /></label>
      <textarea aria-label="Description" maxlength="5000"></textarea>
      <input role="combobox" aria-label="Add speakers" />
      <input type="url" aria-label="Event link" maxlength="1024" />
      <input placeholder="E.g., street, city, pincode, etc." />
      <input placeholder="E.g. floor number, room number, etc." />
      <button type="button" aria-label="Done">Done</button>
    </section>
    <section role="dialog" aria-label="Time zone" id="timezone-picker" hidden>
      <button type="button" role="option" aria-label="(UTC+05:30) Chennai, Kolkata, Mumbai, New Delhi">
        (UTC+05:30) Chennai, Kolkata, Mumbai, New Delhi
      </button>
    </section>
    <section role="listbox" id="speaker-results" hidden>
      <a href="/in/alex-ray/">Alex Ray</a>
    </section>

    <section role="dialog" aria-label="Share that you're hiring" id="hiring-editor" hidden>
      <button type="button" aria-label="Acme Cloud">Acme Cloud</button>
      <input aria-label="Job title" />
      <div role="option">
        <button type="button" data-job-id="444555666" aria-label="Staff Engineer">
          Staff Engineer
        </button>
      </div>
      <button type="button" aria-label="Done">Done</button>
    </section>

    <section role="dialog" aria-label="Find an expert" id="expert-editor" hidden>
      <button type="button" aria-label="Accounting">Accounting</button>
      <button type="button" aria-label="Coaching &amp; Mentoring">Coaching &amp; Mentoring</button>
      <button type="button" aria-label="Design">Design</button>
      <button type="button" aria-label="Marketing">Marketing</button>
      <button type="button" aria-label="Other">Other</button>
      <input role="combobox" aria-label="Location" />
      <textarea minlength="25" maxlength="750"></textarea>
      <button type="button" aria-label="Done">Done</button>
    </section>
    <section role="listbox" id="location-results" hidden>
      <div role="option">Bengaluru, Karnataka, India</div>
    </section>

    <section role="dialog" aria-label="Post settings" id="post-settings" hidden>
      <fieldset>
        <legend>Who can see your post?</legend>
        <label><input type="radio" name="audience" aria-label="Anyone" checked />Anyone</label>
        <label>
          <input type="radio" name="audience" aria-label="Connections only" />
          Connections only
        </label>
        <label><input type="radio" name="audience" aria-label="Group" />Group</label>
      </fieldset>
      <button type="button">Comment control Anyone</button>
      <label>
        Brand partnership
        <input type="checkbox" aria-label="Brand partnership" />
      </label>
      <button type="button" aria-label="Back">Back</button>
      <button type="button" aria-label="Done" disabled>Done</button>
    </section>
    <section role="dialog" aria-label="Comment control" id="comment-control" hidden>
      <label><input type="radio" name="comments" aria-label="Anyone" checked />Anyone</label>
      <label>
        <input type="radio" name="comments" aria-label="Connections only" />
        Connections only
      </label>
      <label><input type="radio" name="comments" aria-label="No one" />No one</label>
      <button type="button" aria-label="Back">Back</button>
      <button type="button" aria-label="Save" disabled>Save</button>
    </section>
    <section role="dialog" aria-label="Choose a group" id="group-picker" hidden>
      <label role="radio">
        <a href="/groups/123456789/">Reliable Systems Community</a>
      </label>
      <button type="button" aria-label="Done">Done</button>
    </section>
    <section role="dialog" aria-label="Add collaborators" id="collaborator-picker" hidden>
      <input role="combobox" aria-label="Search collaborators" />
      <a href="/in/alex-ray/">Alex Ray</a>
      <a href="/company/acme-cloud/">Acme Cloud</a>
      <button type="button" aria-label="Add">Add</button>
    </section>

    <section role="dialog" aria-label="Schedule post" id="schedule-dialog" hidden>
      <label>Date <input aria-label="Date" /></label>
      <label>Time <input aria-label="Time" /></label>
      <button type="button" aria-label="Next">Next</button>
    </section>

    <script>
      const composer = document.querySelector("#composer");
      const composerLoader = document.querySelector("#composer-loader");
      const more = document.querySelector("#more-options");
      const mediaEditor = document.querySelector("#media-editor");
      const photoDetails = document.querySelector("#photo-details");
      const tagMember = document.querySelector("#tag-member");
      const imageEditor = document.querySelector("#image-editor");
      const videoCaptions = document.querySelector("#video-captions");
      const videoThumbnail = document.querySelector("#video-thumbnail");
      const documentEditor = document.querySelector("#document-editor");
      const pollEditor = document.querySelector("#poll-editor");
      const celebrationChooser = document.querySelector("#celebration-chooser");
      const celebrationEditor = document.querySelector("#celebration-editor");
      const eventEditor = document.querySelector("#event-editor");
      const timezonePicker = document.querySelector("#timezone-picker");
      const hiringEditor = document.querySelector("#hiring-editor");
      const expertEditor = document.querySelector("#expert-editor");
      const postSettings = document.querySelector("#post-settings");
      const commentControl = document.querySelector("#comment-control");
      const groupPicker = document.querySelector("#group-picker");
      const collaboratorPicker = document.querySelector("#collaborator-picker");
      const scheduleDialog = document.querySelector("#schedule-dialog");
      const postText = document.querySelector("#post-text");
      const linkPreview = document.querySelector("#link-preview");
      const mentionSuggestions = document.querySelector("#mention-suggestions");
      let mode = "text";
      let scheduled = false;
      let sequence = 7312345678901234500n;

      function show(element) { element.hidden = false; }
      function hide(element) { element.hidden = true; }
      function returnToComposer(element) { hide(element); show(composer); }

      for (let index = 1; index <= 22; index += 1) {
        const template = document.createElement("button");
        template.type = "button";
        template.setAttribute("aria-label", `Template ${index}`);
        template.textContent = `Template ${index}`;
        document.querySelector("#templates").append(template);
      }

      document.querySelector('[aria-label="Start a post"]').onclick = () => {
        const delay = Number(window.__linkedinMcpComposerDelayMs || 0);
        if (!delay) {
          show(composer);
          return;
        }
        show(composerLoader);
        setTimeout(() => {
          hide(composerLoader);
          show(composer);
        }, delay);
      };
      composer.querySelector('[aria-label="More"]').onclick = () => show(more);
      composer.querySelector('[aria-label="Add media"]').onclick = () => {
        hide(composer); show(mediaEditor);
      };
      mediaEditor.querySelector('input[type="file"]').onchange = event => {
        const files = [...event.target.files];
        const video = files.length === 1 && /\.(?:avi|flv|m4v|mkv|mov|mp4|mpeg|mpg|webm|wmv)$/i.test(files[0].name);
        mode = video ? "video" : "images";
        mediaEditor.querySelectorAll("[data-image-select]").forEach(item => item.remove());
        mediaEditor.querySelectorAll("[data-image-control]").forEach(item => {
          item.hidden = video;
        });
        mediaEditor.querySelectorAll("[data-video-control]").forEach(item => {
          item.hidden = !video;
        });
        if (!video) {
          const edit = mediaEditor.querySelector('[aria-label="Edit"]');
          for (const file of files) {
            const select = document.createElement("button");
            select.type = "button";
            select.dataset.imageSelect = "true";
            select.setAttribute("aria-label", `Select ${file.name}`);
            select.textContent = `Select ${file.name}`;
            mediaEditor.insertBefore(select, edit);
          }
          mediaEditor.querySelector('[aria-label="Select diagram.png"]').hidden = true;
        }
      };
      mediaEditor.querySelector('[aria-label="Edit"]').onclick = () => show(imageEditor);
      imageEditor.querySelector('[aria-label="Apply"]').onclick = () => hide(imageEditor);
      mediaEditor.querySelector('[aria-label="Alternative text"]').onclick = () => show(photoDetails);
      photoDetails.querySelector('[aria-label="Add"]').onclick = () => hide(photoDetails);
      mediaEditor.querySelector('[aria-label="Tag"]').onclick = () => show(tagMember);
      tagMember.querySelectorAll("a").forEach(link => {
        link.onclick = event => event.preventDefault();
      });
      tagMember.querySelector('[aria-label="Add"]').onclick = () => hide(tagMember);
      mediaEditor.querySelector('[aria-label="Video thumbnail"]').onclick = () => show(videoThumbnail);
      videoThumbnail.querySelector('[aria-label="Add"]').onclick = () => hide(videoThumbnail);
      mediaEditor.querySelector('[aria-label="Captions"]').onclick = () => show(videoCaptions);
      videoCaptions.querySelector('[aria-label="Apply"]').onclick = () => hide(videoCaptions);
      mediaEditor.querySelector('[aria-label="Next"]').onclick = () => returnToComposer(mediaEditor);

      more.querySelector('[aria-label="Add a document"]').onclick = () => {
        mode = "document"; hide(more); hide(composer); show(documentEditor);
      };
      more.querySelector('[aria-label="Create a poll"]').onclick = () => {
        mode = "poll"; hide(more); hide(composer); show(pollEditor);
      };
      documentEditor.querySelector('[aria-label="Done"]').onclick = () => {
        returnToComposer(documentEditor);
      };
      pollEditor.querySelector('[aria-label="Done"]').onclick = () => returnToComposer(pollEditor);

      composer.querySelector('[aria-label="Celebrate an occasion"]').onclick = () => {
        hide(composer); show(celebrationChooser);
      };
      celebrationChooser.querySelectorAll("button").forEach(button => {
        button.onclick = () => {
          mode = "celebration"; hide(celebrationChooser); show(celebrationEditor);
        };
      });
      celebrationEditor.querySelector('[aria-label="Alternative text"]').onclick = () => {
        show(photoDetails);
      };
      celebrationEditor.querySelector('[aria-label="Next"]').onclick = () => {
        returnToComposer(celebrationEditor);
      };

      composer.querySelector('[aria-label="Create an event"]').onclick = () => {
        mode = "event"; hide(composer); show(eventEditor);
      };
      eventEditor.querySelector('[aria-label="Alternative text"]').onclick = () => {
        show(photoDetails);
      };
      eventEditor.querySelector('[aria-label="Time zone"]').onclick = () => show(timezonePicker);
      timezonePicker.querySelector("[role='option']").onclick = () => hide(timezonePicker);
      eventEditor.querySelector('[aria-label="End date"]').onchange = event => {
        eventEditor.querySelectorAll('[aria-label="End date"], [aria-label="End time"]').forEach((item, index) => {
          if (index > 0 || item.type !== "checkbox") item.hidden = !event.target.checked;
        });
      };
      eventEditor.querySelector('[aria-label="Add speakers"]').oninput = () => {
        show(document.querySelector("#speaker-results"));
      };
      document.querySelector("#speaker-results a").onclick = event => {
        event.preventDefault(); hide(document.querySelector("#speaker-results"));
      };
      eventEditor.querySelector('[aria-label="Done"]').onclick = () => returnToComposer(eventEditor);

      more.querySelector("[aria-label=\"Share that you're hiring\"]").onclick = () => {
        mode = "hiring"; hide(more); hide(composer); show(hiringEditor);
      };
      hiringEditor.querySelector('[data-job-id="444555666"]').onclick = event => {
        event.preventDefault();
      };
      hiringEditor.querySelector('[aria-label="Done"]').onclick = () => returnToComposer(hiringEditor);

      more.querySelector('[aria-label="Find an expert"]').onclick = () => {
        mode = "expert_request"; hide(more); hide(composer); show(expertEditor);
      };
      expertEditor.querySelector('[aria-label="Location"]').oninput = () => {
        show(document.querySelector("#location-results"));
      };
      document.querySelector("#location-results [role='option']").onclick = () => {
        hide(document.querySelector("#location-results"));
      };
      expertEditor.querySelector('[aria-label="Done"]').onclick = () => {
        postText.innerText = expertEditor.querySelector("textarea").value;
        returnToComposer(expertEditor);
      };

      composer.querySelector('[aria-label="Add collaborators"]').onclick = () => {
        hide(composer); show(collaboratorPicker);
      };
      collaboratorPicker.querySelectorAll("a").forEach(link => {
        link.onclick = event => event.preventDefault();
      });
      collaboratorPicker.querySelector('[aria-label="Add"]').onclick = () => {
        returnToComposer(collaboratorPicker);
      };

      composer.querySelector('[aria-label^="Post settings"]').onclick = () => {
        hide(composer); show(postSettings);
      };
      postSettings.querySelector("button:not([aria-label])").onclick = () => {
        hide(postSettings); show(commentControl);
      };
      commentControl.querySelectorAll('input[name="comments"]').forEach(input => {
        input.onchange = () => {
          commentControl.querySelector('[aria-label="Save"]').disabled = false;
        };
      });
      commentControl.querySelector('[aria-label="Save"]').onclick = () => {
        const selected = commentControl.querySelector('input[name="comments"]:checked');
        postSettings.querySelector("button:not([aria-label])").innerText =
          `Comment control ${selected.getAttribute("aria-label")}`;
        commentControl.querySelector('[aria-label="Save"]').disabled = true;
        hide(commentControl); show(postSettings);
      };
      commentControl.querySelector('[aria-label="Back"]').onclick = () => {
        hide(commentControl); show(postSettings);
      };
      postSettings.querySelectorAll('input[name="audience"]').forEach(input => {
        input.onchange = () => {
          postSettings.querySelector('[aria-label="Done"]').disabled = false;
          if (input.getAttribute("aria-label") === "Group") show(groupPicker);
        };
      });
      postSettings.querySelector('[aria-label="Brand partnership"]').onchange = () => {
        postSettings.querySelector('[aria-label="Done"]').disabled = false;
      };
      groupPicker.querySelector("a").onclick = event => event.preventDefault();
      groupPicker.querySelector('[aria-label="Done"]').onclick = () => hide(groupPicker);
      postSettings.querySelector('[aria-label="Back"]').onclick = () => {
        returnToComposer(postSettings);
      };
      postSettings.querySelector('[aria-label="Done"]').onclick = () => {
        returnToComposer(postSettings);
      };
      composer.querySelector('[aria-label="Schedule post"]').onclick = () => {
        hide(composer); show(scheduleDialog);
      };
      scheduleDialog.querySelector('[aria-label="Next"]').onclick = () => {
        scheduled = true;
        composer.querySelector('[aria-label="Post"]').setAttribute("aria-label", "Schedule");
        returnToComposer(scheduleDialog);
      };

      postText.addEventListener("input", () => {
        linkPreview.hidden = !/https:\/\/\S+/.test(postText.innerText);
        mentionSuggestions.hidden = !/@(?:Alex|Acme)/.test(postText.innerText);
      });
      mentionSuggestions.querySelectorAll("a").forEach(link => {
        link.onclick = event => {
          event.preventDefault();
          hide(mentionSuggestions);
        };
      });
      linkPreview.querySelector("button").onclick = () => hide(linkPreview);

      composer.querySelector('button[aria-label="Post"]').onclick = () => {
        if (window.__linkedinMcpPublishOutcome === "failure") {
          hide(composer);
          document.querySelector("#toast").innerText =
            "Sorry, your post was not published. Please try again.";
          return;
        }
        if (scheduled) {
          hide(composer);
          document.querySelector("#toast").innerText = "Post scheduled";
          return;
        }
        sequence += 1n;
        const article = document.createElement("article");
        article.dataset.urn = `urn:li:activity:${sequence}`;
        const text = postText.innerText.trim();
        const marker =
          text ||
          (mode === "poll" && pollEditor.querySelector("textarea[maxlength='140']").value) ||
          (mode === "document" &&
            documentEditor.querySelector("input[placeholder^='Add a descriptive']").value) ||
          (mode === "images" &&
            photoDetails.querySelector("textarea").value) ||
          mode;
        article.innerText = `Current Member\n${marker}`;
        document.querySelector("#feed").prepend(article);
        hide(composer);
        document.querySelector("#toast").innerHTML =
          `Post successful. <a href="/feed/update/urn:li:activity:${sequence}/">View post</a>`;
      };
    </script>
  </body>
</html>
