<!doctype html>
<!-- Deliberate pre-current card root: received listitem is a direct lazy-column child. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Obsolete received invitation structure</title>
  </head>
  <body>
    <main>
      <div role="button" aria-expanded="false" tabindex="0">
        <input aria-hidden="true" type="checkbox" checked />
        Focused (1)
      </div>
      <div data-testid="lazy-column">
        <div role="listitem">
          <a href="/in/obsolete-member/"><strong>Obsolete Member</strong></a>
          <button aria-label="Accept Obsolete Member’s invitation">Accept</button>
        </div>
      </div>
    </main>
  </body>
</html>
