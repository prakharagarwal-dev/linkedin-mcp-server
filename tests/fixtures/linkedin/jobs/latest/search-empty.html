<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Current Empty LinkedIn Jobs Fixture</title>
  </head>
  <body>
    <section aria-label="search filters">
      <h2 class="a11y-text">Jobs search</h2>
      <button type="button" aria-label="Show all filters">All filters</button>
    </section>
    <main>
      <header class="scaffold-layout__list-header">
        <h1>Jobs you may be interested in</h1>
      </header>
      <ul aria-label="Recommended jobs">
        <li data-occludable-job-id="4199999999">
          <div data-job-id="4199999999" class="job-card-container job-card-list">
            <div class="artdeco-entity-lockup__title">
              <a
                class="job-card-list__title--link"
                href="/jobs/view/4199999999/"
                aria-label="Unrelated Recommendation"
              >
                <span aria-hidden="true"><strong>Unrelated Recommendation</strong></span>
                <span class="visually-hidden">Unrelated Recommendation</span>
              </a>
            </div>
            <div class="artdeco-entity-lockup__subtitle">
              <span>Recommendation Company</span>
            </div>
            <div class="artdeco-entity-lockup__caption">
              <span>India (On-site)</span>
            </div>
          </div>
        </li>
      </ul>
      <button type="button" aria-label="Page 1">1</button>
    </main>
  </body>
</html>
